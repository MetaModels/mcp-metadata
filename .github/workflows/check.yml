name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Sources and schema
        run: php bin/build --check
